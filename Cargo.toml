[workspace]
members = ["macros"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.91"

[package]
name = "sotu"
description = "Composable hierarchical state machines"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
version = "0.1.0"

[dependencies]
sotu-macros = { path = "macros", version = "0.1.0", optional = true }

[dev-dependencies]
proptest = "1.12"
proptest-state-machine = "0.9"
test-strategy = "0.4.5"
tryexpand = "=0.14.0"

[features]
default = ["macros"]
macros = ["dep:sotu-macros"]
